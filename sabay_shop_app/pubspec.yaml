name: sabay_shop_app
description: "A professional e-commerce app for Sabay Shop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_translate:
    git:
      url: https://github.com/Javernaver/flutter_translate.git
      ref: master

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0-beta.0
  riverpod_annotation: ^4.0.2
  google_fonts: ^8.0.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  intl: ^0.20.2
  go_router: ^17.2.1
  get_it: ^7.7.0
  equatable: ^2.0.7
  shimmer: ^3.0.0

  phone_form_field: ^10.0.17
  cached_network_image: ^3.4.1
  lottie: ^3.3.3
  flutter_markdown_plus: ^1.0.7
  photo_view: ^0.15.0
  url_launcher: ^6.3.2
  flutter_image_slideshow: ^0.1.6
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/i18n/
    - assets/animations/
